name: ZODIX Desktop Builds
on:
  workflow_dispatch:
  push:
    branches: [main, feat/desktop-multi-conversations, feat/shared-webview-ui]
  pull_request:
    branches: [main]
    paths:
      - "desktop-windows/**"
      - "desktop-linux/**"
      - ".github/workflows/desktop-builds.yml"
permissions:
  contents: read
concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Prepare the draft release without using Actions artifact storage
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::PUBLIC_RELEASE_TOKEN is required to publish desktop installers."
            exit 1
          fi
          version="1.7.5.5"
          tag="desktop-v$version"
          repo="ZodiBoomer/zodi-ai-releases-publique"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --draft --title "ZODIX Desktop $version" --notes "Windows and Linux binaries built from commit $GITHUB_SHA." --repo "$repo"
          else
            gh release create "$tag" --draft --repo "$repo" --title "ZODIX Desktop $version" --notes "Windows and Linux binaries built from commit $GITHUB_SHA."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  windows:
    needs: [prepare-release]
    outputs:
      sha256: ${{ steps.publish.outputs.sha256 }}
    runs-on: windows-2022
    env:
      ZODI_VERSION: 1.7.5.5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Windows application icon from the official ZODIX artwork
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; Image.open('desktop-windows/ZodiAI/Assets/zodix-logo.jpg').convert('RGBA').save('desktop-windows/ZodiAI/Assets/zodix-logo.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64
        run: dotnet publish desktop-windows/ZodiAI/ZodiAI.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:Version=${{ env.ZODI_VERSION }} -o publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:ZODI_VERSION desktop-windows/installer/Zodi-AI.iss'
      - name: Publish Windows installer directly to the draft release
        id: publish
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $hash = (Get-FileHash "release/Zodi-AI-Setup-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release upload $env:RELEASE_TAG "release/Zodi-AI-Setup-x64.exe" --clobber --repo ZodiBoomer/zodi-ai-releases-publique
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
  linux:
    needs: [prepare-release]
    runs-on: ubuntu-22.04
    outputs:
      tar_sha256: ${{ steps.publish.outputs.tar_sha256 }}
      deb_sha256: ${{ steps.publish.outputs.deb_sha256 }}
    env:
      ZODI_VERSION: 1.7.5.5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Linux application icon from the official ZODIX artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; Image.open('desktop-linux/Assets/zodix-logo.jpg').convert('RGBA').resize((512,512), Image.Resampling.LANCZOS).save('desktop-linux/Assets/zodix-logo.png', format='PNG', optimize=True)"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Linux x64
        run: dotnet publish desktop-linux/ZodiAI.Linux.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$ZODI_VERSION -o publish/linux
      - name: Package tar.gz
        run: |
          mkdir -p release/zodi-ai-linux-x64
          cp publish/linux/zodi-ai release/zodi-ai-linux-x64/
          cp publish/linux/zodix-logo.png release/zodi-ai-linux-x64/
          tar -C release -czf release/Zodi-AI-Linux-x64.tar.gz zodi-ai-linux-x64
      - name: Package Debian
        run: |
          mkdir -p package/DEBIAN package/usr/bin package/usr/share/applications package/usr/share/icons/hicolor/512x512/apps
          cp publish/linux/zodi-ai package/usr/bin/zodi-ai
          cp publish/linux/zodix-logo.png package/usr/share/icons/hicolor/512x512/apps/zodi-ai.png
          chmod 755 package/usr/bin/zodi-ai
          printf 'Package: zodi-ai\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nDepends: libgtk-3-0, libwebkit2gtk-4.1-0\nMaintainer: ZodiBoomer\nDescription: ZODIX desktop assistant\n' "$ZODI_VERSION" > package/DEBIAN/control
          printf '[Desktop Entry]\nName=ZODIX\nComment=Assistant personnel ZODIX\nExec=zodi-ai\nIcon=zodi-ai\nTerminal=false\nType=Application\nCategories=Utility;\n' > package/usr/share/applications/zodi-ai.desktop
          dpkg-deb --build package "release/zodi-ai_${ZODI_VERSION}_amd64.deb"
      - name: Publish Linux packages directly to the draft release
        id: publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          deb_asset="zodi-ai_${ZODI_VERSION}_amd64.deb"
          gh release upload "$RELEASE_TAG" \
            "release/Zodi-AI-Linux-x64.tar.gz" "release/$deb_asset" \
            --clobber --repo ZodiBoomer/zodi-ai-releases-publique
          {
            echo "tar_sha256=$(sha256sum "release/Zodi-AI-Linux-x64.tar.gz" | awk '{print $1}')"
            echo "deb_sha256=$(sha256sum "release/$deb_asset" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
  publish-desktop-release:
    name: Finalize Windows and Linux release
    if: github.ref == 'refs/heads/main'
    needs: [prepare-release, windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
      COMMIT_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      WINDOWS_SHA256: ${{ needs.windows.outputs.sha256 }}
      LINUX_TAR_SHA256: ${{ needs.linux.outputs.tar_sha256 }}
      LINUX_DEB_SHA256: ${{ needs.linux.outputs.deb_sha256 }}
    steps:
      - name: Create checksums and desktop manifest, then publish the release
        shell: bash
        run: |
          version="1.7.5.5"
          windows_asset="Zodi-AI-Setup-x64.exe"
          tar_asset="Zodi-AI-Linux-x64.tar.gz"
          deb_asset="zodi-ai_${version}_amd64.deb"
          test -n "$WINDOWS_SHA256"
          test -n "$LINUX_TAR_SHA256"
          test -n "$LINUX_DEB_SHA256"
          mkdir -p release
          printf '%s  %s\n' "$WINDOWS_SHA256" "$windows_asset" > release/SHA256SUMS.txt
          printf '%s  %s\n' "$LINUX_TAR_SHA256" "$tar_asset" >> release/SHA256SUMS.txt
          printf '%s  %s\n' "$LINUX_DEB_SHA256" "$deb_asset" >> release/SHA256SUMS.txt
          cat > release/latest-desktop.json <<EOF
          {
            "schemaVersion": 1,
            "app": "ZODIX",
            "version": "$version",
            "commit": "$COMMIT_SHA",
            "platforms": {
              "windows-x64": {"asset": "$windows_asset"},
              "linux-x64-tar-gz": {"asset": "$tar_asset"},
              "linux-x64-deb": {"asset": "$deb_asset"}
            },
            "checksums": "SHA256SUMS.txt"
          }
          EOF
          gh release upload "$RELEASE_TAG" release/SHA256SUMS.txt release/latest-desktop.json --clobber --repo ZodiBoomer/zodi-ai-releases-publique
          gh release edit "$RELEASE_TAG" --draft=false --title "ZODIX Desktop $version" --notes "Windows and Linux binaries built from commit $COMMIT_SHA." --repo ZodiBoomer/zodi-ai-releases-publique
          gh api --method POST repos/ZodiBoomer/zodi-ai-releases-publique/dispatches \
            -f event_type=zodi-desktop-release-published \
            -F client_payload[tag_name]="$RELEASE_TAG"
