name: Zodi AI Web CI
on:
  workflow_dispatch:
  push:
    branches: [main, feat/zodix-universal-file-ingestion]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "*.json"
      - "*.ts"
      - "*.tsx"
      - ".github/workflows/web-ci.yml"
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test file readers
        run: npm run test:file-readers
      - name: Lint
        run: npm run lint
      - name: Build production web app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Trigger Android rebuild for shared backend changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_REPO_DISPATCH_TOKEN: ${{ secrets.ANDROID_REPO_DISPATCH_TOKEN }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        shell: bash
        run: |
          payload='{"event_type":"zodi-core-updated","client_payload":{"source":"ZodiBoomer/zodi-ai","sha":"'"${{ github.sha }}"'"}}'
          for token in "$ANDROID_REPO_DISPATCH_TOKEN" "$PUBLIC_RELEASE_TOKEN"; do
            if [[ -z "$token" ]]; then
              continue
            fi
            status="$(curl --silent --show-error --output /tmp/android-dispatch-response.json --write-out '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/ZodiBoomer/zodi-ai-android/dispatches \
              -d "$payload" || true)"
            if [[ "$status" == 204 ]]; then
              echo "Android rebuild successfully dispatched."
              exit 0
            fi
            echo "::warning::Android dispatch token did not authorize the private repository (HTTP $status); trying the next configured token."
          done
          echo "::warning::No configured token could dispatch to ZodiBoomer/zodi-ai-android. Web build remains successful; Android must be triggered by its own repository workflow until repository access is corrected."
          exit 0
