name: Build Zodi AI for Linux

on:
  workflow_dispatch:
  push:
    branches:
      - feat/linux-desktop-installer
    paths:
      - "desktop/**"
      - ".github/workflows/linux-desktop.yml"
  pull_request:
    branches:
      - feat/windows-desktop-installer
    paths:
      - "desktop/**"
      - ".github/workflows/linux-desktop.yml"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build and smoke-test Linux app (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Download Electron binary and configure Linux sandbox
        working-directory: desktop
        run: node node_modules/electron/install.js && sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Smoke-test Electron and Zodi AI service
        working-directory: desktop
        env:
          ZODI_SMOKE_TEST: "1"
        run: xvfb-run -a npm run desktop:smoke:linux

      - name: Build AppImage and Debian package
        working-directory: desktop
        run: npm run desktop:dist:linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Zodi-AI-Linux-x64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          retention-days: 30
